<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro Produto</title>
    <link rel="stylesheet" href="">
</head>
<body>
<main class="conteudo">
    <div class="container-formulario">
        <h2>Cadastrar Avaliação</h2>
        
        <form id="form-produto">
            <div class="grupo-input">
                <label>Nome do Produto:</label>
                <input type="text" id="nome" placeholder="Ex: Base Matte" required>
            </div>

            <div class="grupo-input">
                <label>Link da Imagem:</label>
                <input type="url" id="img" placeholder="https://..." required>
            </div>

            <div class="grupo-input">
                <label>Preço (R$):</label>
                <input type="number" id="preco" step="0.01" placeholder="0.00" required>
            </div>

            <div class="grupo-input">
                <label>Comentário:</label>
                <textarea id="descricao" rows="3" placeholder="O que achou do produto?" required></textarea>
            </div>

            <div class="grupo-avaliacao">
                <label>Sua Nota:</label>
                <div class="estrelas-input">
                    <input type="radio" id="st5" name="avaliacao" value="5"><label for="st5" title="Perfeito">★</label>
                    <input type="radio" id="st4" name="avaliacao" value="4"><label for="st4" title="Muito bom">★</label>
                    <input type="radio" id="st3" name="avaliacao" value="3"><label for="st3" title="Bom">★</label>
                    <input type="radio" id="st2" name="avaliacao" value="2"><label for="st2" title="Ruim">★</label>
                    <input type="radio" id="st1" name="avaliacao" value="1"><label for="st1" title="Péssimo">★</label>
                </div>
            </div>

            <button type="submit" class="btn primario">Salvar Produto</button>
        </form>
    </div>
</main>
</body>
</html>
